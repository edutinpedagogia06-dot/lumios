<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo12.png">
<title>Manga & Manhwa — LUMIOS</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<nav class="navbar">
  <div class="logo" id="logoSecret" style="cursor:pointer;display:flex;align-items:center;gap:0.5rem"><img src="logo12.png" alt="" style="width:32px;height:32px;border-radius:6px" onclick="logoClick(event)"><a href="index.html">LUM<em>IO</em>S</a></div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='index.html'"><i class="ti ti-home"></i> Inicio</button>
    <button class="nav-link active" onclick="location.href='manga.html'"><i class="ti ti-book"></i> Manga</button>
    <button class="nav-link" onclick="location.href='anime.html'"><i class="ti ti-device-tv"></i> Anime</button>
    <button class="nav-link" onclick="location.href='peliculas.html'"><i class="ti ti-movie"></i> Películas</button>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input class="search-input" id="searchInput" placeholder="Buscar manga..." type="text" oninput="renderGrid()">
    </div>
    
  </div>
</nav>
<div class="mobile-nav">
  <a href="index.html" class=""><i class="ti ti-home"></i>Inicio</a>
  <a href="manga.html" class="active"><i class="ti ti-book"></i>Manga</a>
  <a href="anime.html" class=""><i class="ti ti-device-tv"></i>Anime</a>
  <a href="peliculas.html" class=""><i class="ti ti-movie"></i>Pelis</a>
  <a href="buscar.html" class=""><i class="ti ti-search"></i>Buscar</a>
</div>

<div class="page-head">
  <h2>Manga <span style="color:var(--red)">&</span> Manhwa</h2>
  <p id="countLabel">Cargando...</p>
</div>
<div class="section" style="padding-top:1.5rem">
  <div class="tabs">
    <button class="tab active" onclick="setTab(this,'todos')">Todos</button>
    <button class="tab" onclick="setTab(this,'manga')">Manga</button>
    <button class="tab" onclick="setTab(this,'manhwa')">Manhwa</button>
    <button class="tab" onclick="setTab(this,'manhua')">Manhua</button>
  </div>
  <div id="grid" class="cards-grid">
    <div class="loading"><div class="spinner"></div><br>Cargando...</div>
  </div>
</div>
<footer><div class="footer-logo">LUM<em>IO</em>S</div><p>Tu universo de contenido · ♥</p></footer>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="github.js"></script>
<script>
let allData = [], currentTab = "todos";
function cardHTML(m) {
  const img = coverUrl(m.cover);
  const badge = m.badge ? `<span class="card-badge badge-${m.badge}">${m.badge}</span>` : "";
  return `<div class="card" onclick="location.href='leer.html?id=${m.id}'">
    <div class="card-cover g1">${img?`<img src="${img}" alt="${m.titulo}" loading="lazy">`:"📖"}${badge}</div>
    <div class="card-info"><div class="card-title">${m.titulo}</div>
    <div class="card-meta"><span class="star">★</span> ${m.rating||"—"} · ${m.tipo||"manga"}</div></div>
  </div>`;
}
function renderGrid() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  let items = currentTab==="todos" ? allData : allData.filter(m=>(m.tipo||"manga")===currentTab);
  if(q) items = items.filter(m=>m.titulo.toLowerCase().includes(q));
  const grid = document.getElementById("grid");
  grid.innerHTML = items.length ? items.map(cardHTML).join("") : `<div class="empty"><span>📖</span><p>No se encontró nada.</p></div>`;
  document.getElementById("countLabel").textContent = `${items.length} título${items.length!==1?"s":""} disponible${items.length!==1?"s":""}`;
}
function setTab(btn,tab){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));btn.classList.add("active");currentTab=tab;renderGrid();}
async function load(){const{data}=await DB.getManga();allData=data;renderGrid();}
load();
</script>
<script>let logoClicks=0,logoTimer=null;function logoClick(e){e.preventDefault();e.stopPropagation();logoClicks++;clearTimeout(logoTimer);if(logoClicks>=3){logoClicks=0;location.href="admin.html";}logoTimer=setTimeout(()=>logoClicks=0,800);}</script>
</body>
</html>
