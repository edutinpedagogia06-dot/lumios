<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo12.png">
<title>Ver Anime — LUMIOS</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<nav class="navbar">
  <div class="logo" onclick="logoClick(event)">
    <img src="logo12.png" alt="">
    <a href="index.html">LUM<em>IO</em>S</a>
  </div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='index.html'"><i class="ti ti-home"></i> Inicio</button>
    <button class="nav-link" onclick="location.href='manga.html'"><i class="ti ti-book"></i> Manga</button>
    <button class="nav-link active" onclick="location.href='anime.html'"><i class="ti ti-device-tv"></i> Anime</button>
    <button class="nav-link" onclick="location.href='peliculas.html'"><i class="ti ti-movie"></i> Películas</button>
  </div>
  <div class="nav-right"></div>
</nav>
<div class="mobile-nav">
  <a href="index.html"><i class="ti ti-home"></i>Inicio</a>
  <a href="manga.html"><i class="ti ti-book"></i>Manga</a>
  <a href="anime.html" class="active"><i class="ti ti-device-tv"></i>Anime</a>
  <a href="peliculas.html"><i class="ti ti-movie"></i>Pelis</a>
  <a href="buscar.html"><i class="ti ti-search"></i>Buscar</a>
</div>

<!-- PLAYER -->
<div id="playerSection" style="display:none;background:#000;padding:0">
  <div style="max-width:900px;margin:0 auto">
    <div class="player-wrap" id="playerWrap"></div>
  </div>
</div>

<!-- DETALLE -->
<div class="detail-hero">
  <div class="detail-inner">
    <div class="detail-cover" id="dCover">🎬</div>
    <div>
      <div class="detail-type">ANIME</div>
      <div class="detail-title" id="dTitle">Cargando...</div>
      <div class="detail-desc" id="dDesc"></div>
      <div class="genre-tags" id="dTags"></div>
      <div style="margin-top:1.1rem;display:flex;gap:.65rem;flex-wrap:wrap" id="dMeta"></div>
    </div>
  </div>
</div>

<!-- EPISODIOS -->
<div class="caps-list" id="epsSection">
  <div class="section-header">
    <div class="section-title">Episodios</div>
    <div id="epsCount" style="font-size:.76rem;color:var(--tx3)"></div>
  </div>
  <div id="epsList"><div class="loading"><div class="spinner"></div><br>Cargando...</div></div>
</div>

<div id="universeContainer"></div>

<footer><div class="footer-logo">LUM<em>IO</em>S</div><p>Tu universo de contenido · ♥</p></footer>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="github.js"></script>
<script>
const params = new URLSearchParams(location.search);
const animeId = params.get("id");
let animeData = null;

function playEpisode(url, epLabel) {
  if (!url) { showToast("Sin enlace de reproducción."); return; }
  const ps = document.getElementById("playerSection");
  const pw = document.getElementById("playerWrap");
  ps.style.display = "";
  // Soporta YouTube, Drive, y URLs directas
  let src = url;
  if (url.includes("youtu.be/")) src = "https://www.youtube.com/embed/" + url.split("youtu.be/")[1].split("?")[0] + "?autoplay=1";
  else if (url.includes("youtube.com/watch")) src = "https://www.youtube.com/embed/" + new URLSearchParams(url.split("?")[1]).get("v") + "?autoplay=1";
  else if (url.includes("drive.google.com")) src = url.replace("/view", "/preview");
  pw.innerHTML = `<iframe src="${src}" allowfullscreen allow="autoplay"></iframe>`;
  ps.scrollIntoView({ behavior: "smooth" });
  showToast("▶ " + epLabel);
}

async function load() {
  try {
    const { data } = await DB.getAnime();
    animeData = data.find(a => a.id === animeId);
  } catch(e) {
    document.getElementById("dTitle").textContent = "Error cargando datos.";
    return;
  }
  if (!animeData) { document.getElementById("dTitle").textContent = "Anime no encontrado."; return; }

  document.title = animeData.titulo + " — LUMIOS";
  document.getElementById("dTitle").textContent = animeData.titulo;
  document.getElementById("dDesc").textContent = animeData.sinopsis || "";
  if (animeData.cover) document.getElementById("dCover").innerHTML = `<img src="${coverUrl(animeData.cover)}" alt="${animeData.titulo}">`;
  document.getElementById("dTags").innerHTML = (animeData.generos || []).map(g => `<span class="genre-tag">${g}</span>`).join("");

  const meta = [];
  if (animeData.estado) meta.push(`<span class="genre-tag">${animeData.estado}</span>`);
  if (animeData.episodios) meta.push(`<span class="genre-tag">${animeData.episodios} episodios</span>`);
  if (animeData.año) meta.push(`<span class="genre-tag">${animeData.año}</span>`);
  document.getElementById("dMeta").innerHTML = meta.join("");

  const eps = animeData.episodios_lista || animeData.episodios_data || [];
  const list = document.getElementById("epsList");
  document.getElementById("epsCount").textContent = eps.length ? `${eps.length} episodio${eps.length>1?"s":""}` : "";

  if (!eps.length) {
    // Si no hay lista de episodios pero hay URL directa
    if (animeData.url) {
      list.innerHTML = `<div class="cap-item" onclick="playEpisode('${animeData.url}','Ver anime')">
        <div><div class="cap-num">Ver ahora</div><div class="cap-title-text">${animeData.titulo}</div></div>
        <i class="ti ti-player-play" style="color:var(--ind2)"></i></div>`;
    } else {
      list.innerHTML = `<div class="empty"><span>🎬</span><p>Sin episodios disponibles aún.</p></div>`;
    }
  } else {
    list.innerHTML = eps.map((ep, i) => `
      <div class="cap-item" onclick="playEpisode('${ep.url||""}','Ep. ${ep.numero||i+1}')">
        <div>
          <div class="cap-num">Episodio ${ep.numero||i+1}</div>
          <div class="cap-title-text">${ep.titulo||""}</div>
        </div>
        <i class="ti ti-player-play" style="color:var(--ind2)"></i>
      </div>`).join("");
  }

  if (animeData.universo) {
    const items = await getUniverseItems(animeData.universo);
    document.getElementById("universeContainer").innerHTML = renderUniverseSection(items, animeData.id);
  }
}
load();
</script>
</body>
</html>
