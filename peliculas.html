<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo12.png">
<title>Películas — LUMIOS</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<nav class="navbar">
  <div class="logo" onclick="logoClick(event)">
    <img src="logo12.png" alt="">
    <a href="index.html">LUM<em>IO</em>S</a>
  </div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='index.html'"><i class="ti ti-home"></i> Inicio</button>
    <button class="nav-link" onclick="location.href='manga.html'"><i class="ti ti-book"></i> Manga</button>
    <button class="nav-link" onclick="location.href='anime.html'"><i class="ti ti-device-tv"></i> Anime</button>
    <button class="nav-link active" onclick="location.href='peliculas.html'"><i class="ti ti-movie"></i> Películas</button>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input class="search-input" id="searchInput" placeholder="Buscar película..." type="text" oninput="renderGrid()">
    </div>
  </div>
</nav>
<div class="mobile-nav">
  <a href="index.html"><i class="ti ti-home"></i>Inicio</a>
  <a href="manga.html"><i class="ti ti-book"></i>Manga</a>
  <a href="anime.html"><i class="ti ti-device-tv"></i>Anime</a>
  <a href="peliculas.html" class="active"><i class="ti ti-movie"></i>Pelis</a>
  <a href="buscar.html"><i class="ti ti-search"></i>Buscar</a>
</div>

<div class="page-head">
  <h2>Películas</h2>
  <p id="countLabel">Cargando...</p>
</div>

<div class="section" style="padding-top:1.5rem">
  <div class="tabs">
    <button class="tab active" onclick="setTab(this,'todos')">Todas</button>
    <button class="tab" onclick="setTab(this,'anime')">Anime</button>
    <button class="tab" onclick="setTab(this,'accion')">Acción</button>
  </div>
  <div id="grid" class="video-grid">
    <div class="loading"><div class="spinner"></div><br>Cargando...</div>
  </div>
</div>

<footer><div class="footer-logo">LUM<em>IO</em>S</div><p>Tu universo de contenido · ♥</p></footer>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="github.js"></script>
<script>
let allData = [], currentTab = "todos";
function cardHTML(p) {
  const img = coverUrl(p.cover);
  return `<div class="video-card" onclick="location.href='ver-pelicula.html?id=${p.id}'">
    <div class="video-thumb g2">
      ${img?`<img src="${img}" alt="${p.titulo}" loading="lazy">`:"🎬"}
      <div class="play-overlay"><div class="play-btn"><i class="ti ti-player-play"></i></div></div>
    </div>
    <div class="video-info">
      <div class="video-title">${p.titulo}</div>
      <div class="video-sub">${p.año||""} · ${p.genero||""}</div>
    </div>
  </div>`;
}
function renderGrid() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  let items = allData;
  if (currentTab !== "todos") items = items.filter(p => (p.categoria||p.genero||"").toLowerCase().includes(currentTab));
  if (q) items = items.filter(p => p.titulo.toLowerCase().includes(q));
  document.getElementById("grid").innerHTML = items.length ? items.map(cardHTML).join("") : `<div class="empty"><span>🎥</span><p>No se encontró nada.</p></div>`;
  document.getElementById("countLabel").textContent = `${items.length} película${items.length!==1?"s":""} disponible${items.length!==1?"s":""}`;
}
function setTab(btn, tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentTab = tab;
  renderGrid();
}
async function load() {
  try {
    const { data } = await DB.getPeliculas();
    allData = data;
    renderGrid();
  } catch(e) {
    document.getElementById("grid").innerHTML = `<div class="empty"><span>⚠️</span><p>Error cargando películas.</p></div>`;
  }
}
load();
</script>
</body>
</html>
