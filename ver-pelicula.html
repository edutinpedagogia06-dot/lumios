</head>
<body>
<nav class="navbar">
  <div class="logo" onclick="logoClick(event)">
    <img src="logo12.png" alt="">
    <a href="index.html">LUM<em>IO</em>S</a>
  </div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='index.html'"><i class="ti ti-home"></i> Inicio</button>
    <button class="nav-link" onclick="location.href='manga.html'"><i class="ti ti-book"></i> Manga</button>
    <button class="nav-link" onclick="location.href='anime.html'"><i class="ti ti-device-tv"></i> Anime</button>
    <button class="nav-link active" onclick="location.href='peliculas.html'"><i class="ti ti-movie"></i> Películas</button>
  </div>
  <div class="nav-right"></div>
</nav>
<div class="mobile-nav">
  <a href="index.html"><i class="ti ti-home"></i>Inicio</a>
  <a href="manga.html"><i class="ti ti-book"></i>Manga</a>
  <a href="anime.html"><i class="ti ti-device-tv"></i>Anime</a>
  <a href="peliculas.html" class="active"><i class="ti ti-movie"></i>Pelis</a>
  <a href="buscar.html"><i class="ti ti-search"></i>Buscar</a>
</div>

<div id="playerSection" style="display:none;background:#000">
  <div style="max-width:900px;margin:0 auto">
    <div class="player-wrap" id="playerWrap"></div>
  </div>
</div>

<div class="detail-hero">
  <div class="detail-inner">
    <div class="detail-cover" id="dCover">🎬</div>
    <div>
      <div class="detail-type">PELÍCULA</div>
      <div class="detail-title" id="dTitle">Cargando...</div>
      <div class="detail-desc" id="dDesc"></div>
      <div class="genre-tags" id="dTags"></div>
      <div style="margin-top:1.1rem" id="dBtn"></div>
    </div>
  </div>
</div>

<div id="universeContainer"></div>

<footer><div class="footer-logo">LUM<em>IO</em>S</div><p>Tu universo de contenido · ♥</p></footer>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="github.js"></script>
<script>
const params = new URLSearchParams(location.search);
const pelId = params.get("id");

function playMovie(url) {
  if (!url) { showToast("Sin enlace disponible."); return; }
  const ps = document.getElementById("playerSection");
  const pw = document.getElementById("playerWrap");
  ps.style.display = "";
  let src = url;
  if (url.includes("youtu.be/")) src = "https://www.youtube.com/embed/" + url.split("youtu.be/")[1].split("?")[0] + "?autoplay=1";
  else if (url.includes("youtube.com/watch")) src = "https://www.youtube.com/embed/" + new URLSearchParams(url.split("?")[1]).get("v") + "?autoplay=1";
  else if (url.includes("drive.google.com")) src = url.replace("/view", "/preview");
  pw.innerHTML = `<iframe src="${src}" allowfullscreen allow="autoplay"></iframe>`;
  ps.scrollIntoView({ behavior: "smooth" });
}

async function load() {
  try {
    const { data } = await DB.getPeliculas();
    const pel = data.find(p => p.id === pelId);
    if (!pel) { document.getElementById("dTitle").textContent = "Película no encontrada."; return; }

    document.title = pel.titulo + " — LUMIOS";
    document.getElementById("dTitle").textContent = pel.titulo;
    document.getElementById("dDesc").textContent = pel.sinopsis || "";
    if (pel.cover) document.getElementById("dCover").innerHTML = `<img src="${coverUrl(pel.cover)}" alt="${pel.titulo}">`;
    document.getElementById("dTags").innerHTML = (pel.generos||[]).map(g=>`<span class="genre-tag">${g}</span>`).join("");

    if (pel.url) {
      document.getElementById("dBtn").innerHTML = `<button class="btn btn-primary" onclick="playMovie('${pel.url}')"><i class="ti ti-player-play"></i> Ver ahora</button>`;
    } else {
      document.getElementById("dBtn").innerHTML = `<span style="color:var(--tx3);font-size:.82rem">Próximamente disponible</span>`;
    }

    if (pel.universo) {
      const items = await getUniverseItems(pel.universo);
      document.getElementById("universeContainer").innerHTML = renderUniverseSection(items, pel.id);
    }
  } catch(e) {
    document.getElementById("dTitle").textContent = "Error cargando datos.";
  }
}
load();
</script>
</body>
</html>
