<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar — LUMIOS</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<nav class="navbar">
  <div class="logo"><a href="index.html">LUM<em>IO</em>S</a></div>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='index.html'"><i class="ti ti-home"></i> Inicio</button>
    <button class="nav-link" onclick="location.href='manga.html'"><i class="ti ti-book"></i> Manga</button>
    <button class="nav-link" onclick="location.href='anime.html'"><i class="ti ti-device-tv"></i> Anime</button>
    <button class="nav-link" onclick="location.href='peliculas.html'"><i class="ti ti-movie"></i> Películas</button>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input class="search-input" id="searchInput" placeholder="Buscar..." type="text" onkeydown="if(event.key==='Enter'){const q=this.value.trim();if(q)location.href='buscar.html?q='+encodeURIComponent(q)}">
    </div>
  </div>
</nav>
<div class="section">
  <div style="margin-bottom:2rem">
    <h2 style="font-size:1.4rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:0.4rem">
      Resultados: <span style="color:var(--red)" id="queryLabel"></span>
    </h2>
    <p style="color:var(--text3);font-size:0.85rem" id="countLabel">Buscando...</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab(this,'todos')">Todos</button>
    <button class="tab" onclick="setTab(this,'manga')">Manga</button>
    <button class="tab" onclick="setTab(this,'anime')">Anime</button>
    <button class="tab" onclick="setTab(this,'pelicula')">Películas</button>
  </div>
  <div id="results"><div class="loading"><div class="spinner"></div><br>Buscando...</div></div>
</div>
<footer><div class="footer-logo">LUM<em>IO</em>S</div><p>Tu universo de contenido · ♥</p></footer>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="github.js"></script>
<script>
const params = new URLSearchParams(location.search);
const query = params.get("q")||"";
let allResults=[], currentTab="todos";
document.getElementById("searchInput").value = query;
document.getElementById("queryLabel").textContent = `"${query}"`;

function render() {
  let items = currentTab==="todos" ? allResults : allResults.filter(r=>r._type===currentTab);
  document.getElementById("countLabel").textContent = `${items.length} resultado${items.length!==1?"s":""}`;
  if (!items.length) { document.getElementById("results").innerHTML=`<div class="empty"><span>🔍</span><p>Sin resultados para "${query}".</p></div>`; return; }
  const manga=items.filter(r=>r._type==="manga");
  const anime=items.filter(r=>r._type==="anime");
  const pelis=items.filter(r=>r._type==="pelicula");
  let html="";
  if(manga.length) html+=`<div class="section-title" style="margin-bottom:1rem">Manga</div><div class="cards-grid" style="margin-bottom:2rem">${manga.map(m=>{
    const img=coverUrl(m.cover);
    return `<div class="card" onclick="location.href='leer.html?id=${m.id}'"><div class="card-cover g1">${img?`<img src="${img}" alt="${m.titulo}" loading="lazy">`:"📖"}</div><div class="card-info"><div class="card-title">${m.titulo}</div><div class="card-meta"><span class="star">★</span>${m.rating||"—"}</div></div></div>`;
  }).join("")}</div>`;
  if(anime.length) html+=`<div class="section-title" style="margin-bottom:1rem">Anime</div><div class="video-grid" style="margin-bottom:2rem">${anime.map(a=>{
    const img=coverUrl(a.cover);
    return `<div class="video-card" onclick="location.href='ver-anime.html?id=${a.id}'"><div class="video-thumb g2">${img?`<img src="${img}" loading="lazy">`:"🎬"}<div class="play-overlay"><div class="play-btn"><i class="ti ti-player-play"></i></div></div></div><div class="video-info"><div class="video-title">${a.titulo}</div><div class="video-sub">${a.genero||""}</div></div></div>`;
  }).join("")}</div>`;
  if(pelis.length) html+=`<div class="section-title" style="margin-bottom:1rem">Películas</div><div class="video-grid">${pelis.map(p=>{
    const img=coverUrl(p.cover);
    return `<div class="video-card" onclick="location.href='ver-pelicula.html?id=${p.id}'"><div class="video-thumb g1">${img?`<img src="${img}" loading="lazy">`:"🎥"}<div class="play-overlay"><div class="play-btn"><i class="ti ti-player-play"></i></div></div></div><div class="video-info"><div class="video-title">${p.titulo}</div><div class="video-sub">${p.genero||""}</div></div></div>`;
  }).join("")}</div>`;
  document.getElementById("results").innerHTML = html;
}
function setTab(btn,tab){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));btn.classList.add("active");currentTab=tab;render();}
async function load() {
  const q=query.toLowerCase();
  const [{data:manga},{data:anime},{data:pelis}]=await Promise.all([DB.getManga(),DB.getAnime(),DB.getPeliculas()]);
  allResults=[
    ...manga.filter(m=>m.titulo.toLowerCase().includes(q)||(m.sinopsis||"").toLowerCase().includes(q)).map(m=>({...m,_type:"manga"})),
    ...anime.filter(a=>a.titulo.toLowerCase().includes(q)||(a.sinopsis||"").toLowerCase().includes(q)).map(a=>({...a,_type:"anime"})),
    ...pelis.filter(p=>p.titulo.toLowerCase().includes(q)||(p.sinopsis||"").toLowerCase().includes(q)).map(p=>({...p,_type:"pelicula"}))
  ];
  render();
}
load();
</script>
</body>
</html>
